services:
  postgres:
  
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-15}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Admin__FirstName: ${ADMIN_FIRST_NAME:-System}
      Admin__LastName: ${ADMIN_LAST_NAME:-Administrator}
      Seed__Enabled: ${SEED_ENABLED:-true}
      Seed__CustomerPassword: ${SEED_CUSTOMER_PASSWORD}
      Email__Host: ${EMAIL__HOST:-}
      Email__Port: ${EMAIL__PORT:-587}
      Email__Username: ${EMAIL__USERNAME:-}
      Email__Password: ${EMAIL__PASSWORD:-}
      Email__FromEmail: ${EMAIL__FROMEMAIL:-}
      Email__FromName: ${EMAIL__FROMNAME:-ECommerce}
      Email__UseStartTls: ${EMAIL__USESTARTTLS:-true}
      ProductExport__RecipientEmail: ${PRODUCT_EXPORT_RECIPIENT:-admin@example.com}
      ProductExport__CronExpression: "${PRODUCT_EXPORT_CRON:-0 8 * * *}"
      Payments__Sandbox__Enabled: ${PAYMENTS__SANDBOX__ENABLED:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-3010}:8080"
    depends_on:
      - api
volumes:
  postgres_data:
